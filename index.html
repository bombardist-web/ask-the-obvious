
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask the Obvious</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eaf6ff;
      color: #183047;
      text-align: center;
      padding: 30px 15px;
    }
    main {
      max-width: 650px;
      margin: 50px auto;
      background: white;
      padding: 30px 20px;
      border-radius: 18px;
      box-shadow: 0 4px 18px #00000012;
    }
    h1 { color: #1677c8; }
    input {
      width: 90%;
      max-width: 480px;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 8px;
    }
    button {
      padding: 13px 20px;
      margin: 10px 5px;
      border: 0;
      border-radius: 8px;
      background: #1677c8;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #answer {
      margin: 25px auto;
      padding: 18px;
      max-width: 520px;
      background: #f1f8ff;
      border-radius: 10px;
      text-align: left;
      white-space: pre-wrap;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Ask the Obvious</h1>
    <h2>Curious? Just ask.</h2>
    <p>Everyday questions. Simple answers.</p>

    <form id="questionForm">
      <input id="question" type="text"
        placeholder="Ask me anything..."
        maxlength="1000" required>
      <br>
      <button id="askButton" type="submit">Ask Question</button>
    </form>

    <div id="answer">Your answer will appear here.</div>
    <p>Powered by AI</p>
  </main>

  <script>
    const API_URL =
      "https://ask-the-obvious-api.delane41506.workers.dev/";

    const form = document.getElementById("questionForm");
    const input = document.getElementById("question");
    const answer = document.getElementById("answer");
    const button = document.getElementById("askButton");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const question = input.value.trim();
      if (!question) return;

      button.disabled = true;
      answer.textContent = "Thinking... Please wait.";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Something went wrong.");
        }

        answer.textContent = data.answer;
      } catch (error) {
  answer.textContent = "Error: " + error.message;
      }
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
